version: 2.1

orbs:
  node: circleci/node@5.2.0

parameters:
  target_env:
    type: enum
    enum: ["none", "dev", "staging", "prod"]
    default: "none"

jobs:
  run-scenario-tests:
    parameters:
      target_env:
        type: string
    executor: node/default
    resource_class: medium
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Run Bruno scenario tests on << parameters.target_env >>
          command: |
            cd collections/Healthily-V1
            npx --yes @usebruno/cli run Scenarios -r --env "Healthily-<< parameters.target_env >>" \
              --env-var partner_id="${PARTNER_ID}" \
              --env-var partner_secret="${PARTNER_SECRET}" \
              --env-var api_key="${API_KEY}"

workflows:
  manual-tests-dev:
    when:
      equal: ["dev", << pipeline.parameters.target_env >>]
    jobs:
      - run-scenario-tests:
          target_env: "dev"
          context:
            - api_dev
  manual-tests-staging:
    when:
      equal: ["staging", << pipeline.parameters.target_env >>]
    jobs:
      - run-scenario-tests:
          target_env: "staging"
          context: api_staging
  manual-tests-prod:
    when:
      equal: ["prod", << pipeline.parameters.target_env >>]
    jobs:
      - run-scenario-tests:
          target_env: "prod"
          context: api_prod
  scheduled-tests:
    triggers:
      - schedule:
          cron: "0 5 * * *"
          filters:
            branches:
              only:
                - main
    jobs:
      - run-scenario-tests:
          name: scheduled-prod
          target_env: "prod"
          context: api_prod
      - run-scenario-tests:
          name: scheduled-staging
          target_env: "staging"
          context: api_staging
