info:
  name: Symptom Injury
  type: http
  seq: 20

http:
  method: POST
  url: "{{base_url}}/{{api_subpath}}/chat"
  headers:
    - name: x-api-key
      value: "{{api_key}}"
  body:
    type: json
    data: |-
      {
          "type": "symptom",
          "included": ["n"],
          "excluded": ["y", "?"]
      }
  auth:
    type: bearer
    token: "{{v5_upgraded_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
