info:
  name: Duration
  type: http
  seq: 9

http:
  method: POST
  url: "{{base_url}}/{{api_subpath}}/chat"
  headers:
    - name: x-api-key
      value: "{{api_key}}"
  body:
    type: json
    data: |-
      {
          "type": "generic",
          "included": ["week"],
          "excluded": ["hour", "day", "year", "month"]
      }
  auth:
    type: bearer
    token: "{{v5_upgraded_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
